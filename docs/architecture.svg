<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F7F5F0"/><stop offset="1" stop-color="#E9E5DB"/></linearGradient><linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F2E5C6"/><stop offset="1" stop-color="#E5C984"/></linearGradient><linearGradient id="data" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E7EDF5"/><stop offset="1" stop-color="#D8E2EE"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#9A8D78" flood-opacity=".22"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7B7A76"/></marker><style>.t{font:700 34px Arial,sans-serif;fill:#2E2C28}.sub{font:500 17px Arial,sans-serif;fill:#716D65}.h{font:700 19px Arial,sans-serif;fill:#36332E}.p{font:500 13px Arial,sans-serif;fill:#6A665F}.m{font:700 11px Arial,sans-serif;fill:#8A6B2D;letter-spacing:2px}.mono{font:600 11px monospace;fill:#65625B}</style></defs>
<rect width="1600" height="900" rx="28" fill="url(#bg)"/><text x="70" y="62" class="t">DevKit — Architecture</text><text x="70" y="92" class="sub">A static, client-side workspace where each developer utility is isolated into reusable logic and lazy-loaded routes.</text>
<text x="70" y="142" class="m">APPLICATION SHELL</text><g filter="url(#s)"><rect x="70" y="160" width="300" height="125" rx="22" fill="#FBFAF7"/><rect x="430" y="160" width="330" height="125" rx="22" fill="url(#core)"/><rect x="820" y="160" width="330" height="125" rx="22" fill="#FBFAF7"/><rect x="1210" y="160" width="320" height="125" rx="22" fill="url(#data)"/></g>
<text x="100" y="198" class="h">React 19</text><text x="100" y="225" class="p">Application UI + shared components</text><text x="100" y="246" class="p">Theme, panels, editor surfaces</text><text x="460" y="198" class="h">React Router</text><text x="460" y="225" class="p">One route per utility</text><text x="460" y="246" class="p">Lazy-loaded tool modules</text><text x="850" y="198" class="h">Tool Registry</text><text x="850" y="225" class="p">Sidebar + dashboard + command palette</text><text x="850" y="246" class="p">Shared metadata and navigation</text><text x="1240" y="198" class="h">Browser Runtime</text><text x="1240" y="225" class="p">Web APIs + local files + workers</text><text x="1240" y="246" class="p">No backend or database</text>
<path d="M370 222H430M760 222H820M1150 222H1210" stroke="#7B7A76" stroke-width="3" fill="none" marker-end="url(#a)"/>
<text x="70" y="345" class="m">UTILITY ROUTES</text><g filter="url(#s)"><rect x="70" y="365" width="350" height="145" rx="22" fill="#F9F6EE"/><rect x="470" y="365" width="350" height="145" rx="22" fill="#F7F9FC"/><rect x="870" y="365" width="290" height="145" rx="22" fill="#F2F8F2"/><rect x="1210" y="365" width="320" height="145" rx="22" fill="#F7F1E8"/></g>
<text x="100" y="403" class="h">JWT Tools</text><text x="100" y="431" class="p">Decode • verify • sign • fuzz</text><text x="100" y="452" class="p">jose + Web Crypto API</text><text x="100" y="473" class="p">Validator / encoder / key utilities</text><text x="500" y="403" class="h">JSON Tools</text><text x="500" y="431" class="p">Format • validate • convert • diff</text><text x="500" y="452" class="p">Ajv • JSONPath • YAML/XML/CSV</text><text x="500" y="473" class="p">Editor + syntax highlighting</text><text x="900" y="403" class="h">Crypto &amp; Security</text><text x="900" y="431" class="p">AES-256-GCM • RSA-OAEP</text><text x="900" y="452" class="p">Hashing • passwords • API keys</text><text x="900" y="473" class="p">File-aware operations</text><text x="1240" y="403" class="h">Encoding &amp; Web</text><text x="1240" y="431" class="p">Base64 • URL • Regex</text><text x="1240" y="452" class="p">UUID • URL parser • HTML entities</text><text x="1240" y="473" class="p">Developer utilities</text>
<path d="M245 285V365M595 285V365M985 285V365M1370 285V365" stroke="#8E8A82" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#a)"/>
<text x="70" y="570" class="m">PURE LOGIC LAYER</text><g filter="url(#s)"><rect x="70" y="590" width="470" height="140" rx="22" fill="#FBFAF7"/><rect x="590" y="590" width="470" height="140" rx="22" fill="url(#core)"/><rect x="1110" y="590" width="420" height="140" rx="22" fill="#FBFAF7"/></g>
<text x="100" y="628" class="h">src/lib/</text><text x="100" y="656" class="p">jwt.ts • json.ts • crypto.ts • md5.ts</text><text x="100" y="677" class="p">password.ts • uuidgen.ts • encoding.ts</text><text x="100" y="698" class="p">Pure logic separated from UI</text><text x="620" y="628" class="h">Local Browser APIs</text><text x="620" y="656" class="p">Web Crypto • File API • Web Workers</text><text x="620" y="677" class="p">Client-side processing only</text><text x="620" y="698" class="p">No server-side data path</text><text x="1140" y="628" class="h">Validation &amp; Conversion</text><text x="1140" y="656" class="p">Ajv • js-yaml • XML parser</text><text x="1140" y="677" class="p">JSONPath • diffing • CSV</text><text x="1140" y="698" class="p">Specialized utility dependencies</text>
<path d="M245 510V590M645 510V590M1015 510V590M1370 510V590" stroke="#9A8F79" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#a)"/>
<text x="70" y="785" class="m">DELIVERY</text><rect x="70" y="805" width="1460" height="48" rx="18" fill="#FFF" opacity=".82"/><text x="800" y="835" text-anchor="middle" class="mono">User input → route → pure utility logic → browser API / local processing → result → download / copy</text>
</svg>
